# Nginx da VPS (instalado direto no servidor, fora do Docker).
# Copie para /etc/nginx/sites-available/directflow e ative.
# Depois rode: sudo certbot --nginx -d directflow.codeshot.com.br
# O Certbot adiciona o bloco HTTPS (443) e o redirecionamento de HTTP para HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name directflow.codeshot.com.br;

    server_tokens off;
    client_max_body_size 1m;   # mesmo limite do app (MAX_BODY)

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sobrescreve (não acumula): o app usa o 1º IP do header no limite de login,
        # então não pode aceitar um valor forjado pelo cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
