# App atrás do Nginx da VPS (HTTPS via Certbot) — veja deploy/nginx-directflow.conf.
# Uso: docker compose up -d --build
services:
  app:
    build: .
    image: linka-direct:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false   # opcional: credenciais e senha podem ser definidas pelo painel
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-https://directflow.codeshot.com.br}
      DB_PATH: /app/data/app.db
      TRUST_PROXY: "1"
    volumes:
      - app-data:/app/data
    ports:
      - "127.0.0.1:${HOST_PORT:-3010}:3000"   # só o Nginx local acessa, não a internet
    stop_grace_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  app-data:
